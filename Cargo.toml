[package]
name = "strix-aleph"
version = "0.2.5"
edition = "2021"
rust-version = "1.80"
authors = ["Shubhankar Dixit"]
description = "TUI for your notes — Obsidian vaults, Strix sync, and connect with Codex/Claude Code/etc. to manage your knowledge from the terminal."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Shubhankar-Dixit/Aleph"
homepage = "https://github.com/Shubhankar-Dixit/Aleph"
keywords = ["tui", "notes", "obsidian", "strix", "cli"]
categories = ["command-line-utilities"]
exclude = [
    "aleph_idea.md",
    "Ideas.md",
    "ideas2.md",
    "HOWTOTHINK.md",
    "ascii.md",
    "ascii-eye2.md",
    "strix-agents.md",
    "TODOS.md",
    "tests1.rs",
    "AGENTS.md",
]

[dependencies]
anyhow = "1"
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tui-markdown = "0.3.7"
unicode-segmentation = "1.12"
unicode-width = "0.2"
urlencoding = "2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
